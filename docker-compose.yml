services:
  writer-app:
    build: .
    container_name: writer_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app          # <--- Live-mounts your code folder
      - ./vault:/app/vaults
    restart: unless-stopped

  syncthing:
    image: syncthing/syncthing:latest
    container_name: vault_sync
    volumes:
      - ./vault:/var/syncthing/vaults
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
    restart: unless-stopped

