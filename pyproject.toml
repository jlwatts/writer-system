[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, and bugbear. Pyupgrade and import sorting
# are left off so existing files are not rewritten just to satisfy the gate.
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.pydocstyle]
# Lint docstrings that exist. Missing module and function docstrings are not
# required yet.
convention = "pep257"
add-ignore = "D100,D101,D102,D103,D104,D105,D107"
